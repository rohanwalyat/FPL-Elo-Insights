[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fpl-insights"
version = "0.1.0"
description = "A comprehensive FPL data engine and analytics dashboard"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Rohan Walyat" }
]
dependencies = [
    "pandas>=2.3.0",
    "numpy>=2.2.0",
    "requests>=2.28.0",
    "python-dotenv>=0.19.0",
    "streamlit>=1.30.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "jupyter>=1.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
